name: Sync from OneDrive

on:
  schedule:
    - cron: '0 18 * * 5,6'
    - cron: '0 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install msal requests
      - run: python .github/scripts/sync_onedrive.py
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_DRIVE_ID: ${{ secrets.AZURE_DRIVE_ID }}
      - run: |
          git config user.name bot && git config user.email bot@sync.dev
                    git checkout HEAD -- 购买记/认识计算机操作系统.md
          git add -A && git diff --cached --quiet || git commit -m sync && git push
