# OneDrive → GitHub 知识库自动同步
# 每周五/六 18:00 UTC = 周六/日凌晨 02:00 CST
# 每周日 14:00 UTC = 22:00 CST
# 使用 MSAL 客户端凭证模式获取 Graph API Token
# 流程：onedrive-sync 分支 → 自动 PR

name: Sync from OneDrive

on:
  schedule:
    - cron: '0 18 * * 5,6'   # 周六/日凌晨 02:00 CST
    - cron: '0 14 * * 0'     # 周日 22:00 CST
  workflow_dispatch:       # 也支持手动运行

permissions:
  contents: write
  pull-requests: write    # 需要创建 PR

env:
  SYNC_BRANCH: onedrive-sync
  BASE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (fetch all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取全部历史，以便切换分支
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install msal requests

      - name: Switch to sync branch
        run: |
          # 如果 onedrive-sync 分支已存在则直接切过去，否则从 main 创建
          # 用 reset --hard 保持分支与 main 一致，避免 git merge 导致的冲突
          if git show-ref --verify --quiet refs/heads/${{ env.SYNC_BRANCH }}; then
            git checkout ${{ env.SYNC_BRANCH }}
            # 强制重置到 main 的起点，保持干净的基线
            git reset --hard origin/${{ env.BASE_BRANCH }}
          else
            git checkout -b ${{ env.SYNC_BRANCH }} origin/${{ env.BASE_BRANCH }}
          fi

      - name: Sync from OneDrive
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_DRIVE_ID: ${{ secrets.AZURE_DRIVE_ID }}
          LOCAL_REPO_PATH: ${{ github.workspace }}
        run: python .github/scripts/sync_onedrive.py

      - name: Commit and push to sync branch
        id: commit
        run: |
          git config user.name "暝烁 Bot"
          git config user.email "bot@knowledge-library.sync"
          git add -A
          # 注意：bash -e 模式下 git diff --cached --quiet 返回 1（有变更）会被当成错误
          # 使用 || true 防止脚本被终止
          HAS_CHANGES=0
          git diff --cached --quiet || HAS_CHANGES=$?
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          if [ "$HAS_CHANGES" -eq 1 ]; then
            git commit -m "📎 OneDrive 自动同步 $(date '+%Y-%m-%d %H:%M')"
            git push --force origin ${{ env.SYNC_BRANCH }}
            echo "✅ 已提交并推送至 ${{ env.SYNC_BRANCH }}"
          else
            echo "⏭️  没有变更，跳过提交"
          fi

      - name: Create PR if changes exist
        if: steps.commit.outputs.has_changes == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 检查是否已有从这个分支到 main 的开放 PR
          EXISTING_PR=$(gh pr list --head ${{ env.SYNC_BRANCH }} --base ${{ env.BASE_BRANCH }} --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "🔄 PR #$EXISTING_PR 已存在，更新 PR 描述"
            gh pr edit $EXISTING_PR --body "📎 OneDrive 自动同步 $(date '+%Y-%m-%d %H:%M')\n\n本次同步由 GitHub Actions 自动触发。"
            PR_NUMBER=$EXISTING_PR
          else
            echo "🆕 创建新的 PR..."
            PR_URL=$(gh pr create \
              --head ${{ env.SYNC_BRANCH }} \
              --base ${{ env.BASE_BRANCH }} \
              --title "📎 OneDrive 知识库同步 $(date '+%Y-%m-%d')" \
              --body "📎 OneDrive 自动同步 $(date '+%Y-%m-%d %H:%M')\n\n本次同步由 GitHub Actions 自动触发。")
            PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$')
          fi
          # 自动合并 PR 到 main（主子要求：无需人工审批，直接合并）
          if [ -n "$PR_NUMBER" ]; then
            echo "🚀 自动合并 PR #$PR_NUMBER..."
            gh pr merge "$PR_NUMBER" --squash || echo "⚠️  自动合并失败，可能需要手动处理"
          fi
