name: Sync from OneDrive

on:
  schedule:
    - cron: '0 18 * * 5,6'
    - cron: '0 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      
      - name: Install dependencies
        run: pip install msal requests
      
      - name: Run sync script (OneDrive → GitHub)
        run: python .github/scripts/sync_onedrive.py
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_DRIVE_ID: ${{ secrets.AZURE_DRIVE_ID }}
      
      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to sync"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi
      
      - name: Commit and Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          BRANCH="sync/onedrive-$(date +%Y%m%d%H%M%S)"
          git config user.name "bot"
          git config user.email "bot@sync.dev"
          git checkout -b "$BRANCH"
          git commit -m "sync: OneDrive -> GitHub auto sync"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --fill)
          gh pr merge "$PR_URL" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
